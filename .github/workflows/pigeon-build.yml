name: Pigeon Build

on:
  push:
    branches:
      - 'pigeon-*'

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install xvfb and libpulse0
        run: sudo apt-get install xvfb libpulse0 || (sudo apt-get update && sudo apt-get install xvfb libpulse0)

      - name: Install node_modules
        run: pnpm install
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      - run: pnpm run generate
      - run: pnpm run prepare-beta-build

      - name: Create bundle
        run: pnpm run build:esbuild:prod

      - name: Create preload cache
        run: xvfb-run --auto-servernum pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/linux

      - name: Build .deb
        run: pnpm run build:release --publish=never
        env:
          DISABLE_INSPECT_FUSE: on

      - name: Inspect Linux outputs
        run: |
          ls -la release || true
          find release -maxdepth 2 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.yml' -o -name '*.blockmap' \) || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/**/*.deb
            release/**/*.AppImage
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install node_modules
        run: pnpm install
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      - run: pnpm run generate
      - run: pnpm run prepare-beta-build
      - run: touch noop.sh && chmod +x noop.sh

      - name: Build .dmg
        run: pnpm run build
        env:
          DISABLE_INSPECT_FUSE: on
          SIGN_MACOS_SCRIPT: noop.sh
          ARTIFACTS_DIR: artifacts/macos

      - name: Inspect macOS outputs
        run: |
          ls -la release || true
          find release -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install node_modules
        run: pnpm install
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      - run: pnpm run generate
      - run: copy package.json temp.json
      - run: del package.json
      - run: type temp.json | findstr /v certificateSubjectName | findstr /v certificateSha1 > package.json
      - run: pnpm run prepare-beta-build

      - name: Create bundle
        run: pnpm run build:esbuild:prod

      - name: Create preload cache
        run: pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/win

      - name: Build .exe
        run: pnpm run build:release
        env:
          DISABLE_INSPECT_FUSE: on

      - name: Inspect Windows outputs
        shell: pwsh
        run: |
          if (Test-Path release) { Get-ChildItem -Path release -Recurse -File | Select-Object FullName }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.nupkg
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Tag and Publish Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    if: success()
    timeout-minutes: 20

    steps:
      - name: Generate release metadata
        id: meta
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          TAG="${SAFE_REF}-build-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=Pigeon ${SAFE_REF} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets/windows

      - name: Inspect collected release assets
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            release-assets/linux/**
            release-assets/macos/**
            release-assets/windows/**

